name: Test Golf Passport
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check and test
        run: npm run check && npm test
      - name: Build and validate hosted Worker
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: golf-passport-worker
          path: dist
          include-hidden-files: true
